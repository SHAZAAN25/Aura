<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <!-- Refined Gradient -->
    <linearGradient id="auraAperture" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818CF8"/>
      <stop offset="50%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#4F46E5"/>
    </linearGradient>

    <linearGradient id="auraAccent" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>
  </defs>

  <!-- Clean Dark Container -->
  <rect width="160" height="160" rx="36" fill="#0B0F19" stroke="#1E293B" stroke-width="1.5"/>

  <!-- Minimalist Geometric Apex "A" with Radiant Concentric Retrieval Waves -->
  <!-- Outer Focus Ring -->
  <circle cx="80" cy="80" r="54" fill="none" stroke="#1E293B" stroke-width="1.5"/>
  <circle cx="80" cy="80" r="42" fill="none" stroke="#312E81" stroke-width="1.2" stroke-dasharray="4 3"/>

  <!-- Core "A" Monogram / Prism Apex -->
  <!-- Left Leg -->
  <path d="M 80 34 L 46 114" stroke="url(#auraAccent)" stroke-width="5" stroke-linecap="round"/>
  
  <!-- Right Leg -->
  <path d="M 80 34 L 114 114" stroke="url(#auraAperture)" stroke-width="5" stroke-linecap="round"/>

  <!-- Crossbar / Radiant Bridge -->
  <path d="M 58 88 L 102 88" stroke="#A5B4FC" stroke-width="3" stroke-linecap="round"/>

  <!-- Central Retrieval Focus Point -->
  <circle cx="80" cy="62" r="5.5" fill="#38BDF8"/>
  <circle cx="80" cy="62" r="2.5" fill="#FFFFFF"/>
</svg>
