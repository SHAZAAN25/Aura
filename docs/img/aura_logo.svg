<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <!-- Background Glow Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7928CA" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#00DFD8" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#0B0F19" stop-opacity="0"/>
    </radialGradient>

    <!-- Aura Core Gradient -->
    <linearGradient id="auraGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF"/>
      <stop offset="45%" stop-color="#7000FF"/>
      <stop offset="100%" stop-color="#FF007A"/>
    </linearGradient>

    <!-- Ring Gradient -->
    <linearGradient id="ringGrad" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00DFD8"/>
      <stop offset="50%" stop-color="#7928CA"/>
      <stop offset="100%" stop-color="#4F46E5"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Ambient Light -->
  <circle cx="100" cy="100" r="95" fill="url(#bgGlow)"/>

  <!-- Outer Energy Orbit -->
  <circle cx="100" cy="100" r="82" fill="none" stroke="url(#ringGrad)" stroke-width="2.5" stroke-dasharray="8 6" opacity="0.6"/>

  <!-- Concentric Orbit Nodes -->
  <circle cx="100" cy="18" r="4.5" fill="#00F0FF" filter="url(#neonGlow)"/>
  <circle cx="171" cy="141" r="3.5" fill="#FF007A" filter="url(#neonGlow)"/>
  <circle cx="29" cy="141" r="3.5" fill="#7000FF" filter="url(#neonGlow)"/>

  <!-- Intermediate Aura Wave Ring -->
  <circle cx="100" cy="100" r="66" fill="none" stroke="url(#auraGrad)" stroke-width="3" opacity="0.85"/>

  <!-- Inner Sacred Hexagonal Orchestration Geometry -->
  <polygon points="100,45 147.6,72.5 147.6,127.5 100,155 52.4,127.5 52.4,72.5" 
           fill="none" stroke="url(#ringGrad)" stroke-width="3.5" stroke-linejoin="round" opacity="0.9"/>

  <!-- Inner Neural Nexus Star -->
  <polygon points="100,58 136.4,79 136.4,121 100,142 63.6,121 63.6,79" 
           fill="#0B0F19" fill-opacity="0.75" stroke="url(#auraGrad)" stroke-width="2" stroke-linejoin="round"/>

  <!-- Central Energy Core - The Aura Singularity -->
  <circle cx="100" cy="100" r="24" fill="url(#auraGrad)" filter="url(#neonGlow)"/>
  
  <!-- Core Inner Prism Flare -->
  <polygon points="100,82 112,100 100,118 88,100" fill="#FFFFFF" opacity="0.95"/>
  <circle cx="100" cy="100" r="6" fill="#FFFFFF" filter="url(#neonGlow)"/>

  <!-- Neural Connection Rays -->
  <line x1="100" y1="45" x2="100" y2="76" stroke="#00F0FF" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
  <line x1="147.6" y1="72.5" x2="121" y2="88" stroke="#7928CA" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
  <line x1="147.6" y1="127.5" x2="121" y2="112" stroke="#FF007A" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
  <line x1="100" y1="155" x2="100" y2="124" stroke="#FF007A" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
  <line x1="52.4" y1="127.5" x2="79" y2="112" stroke="#7000FF" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
  <line x1="52.4" y1="72.5" x2="79" y2="88" stroke="#00DFD8" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
</svg>
